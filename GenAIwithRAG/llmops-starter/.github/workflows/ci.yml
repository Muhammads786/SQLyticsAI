name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static checks
        run: python -m pip check || true
      - name: RAG eval (dry)
        run: |
          echo '{"question":"What is this project about?","answer":"starter scaffold"}' > evals/goldens.jsonl
          python - << 'PY'
from pathlib import Path; Path("data").mkdir(exist_ok=True); Path("data/readme.txt").write_text("LLMOps starter")
print("Wrote sample")
PY
  # promptfoo step can be added with node setup if desired
